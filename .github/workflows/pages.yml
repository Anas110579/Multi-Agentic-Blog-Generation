name: Deploy BlogBoard to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "blogboard/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set public R2 URL
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [[ -z "$R2_PUBLIC_URL" ]]; then
            echo "Repository variable R2_PUBLIC_URL must be set to the public R2 bucket URL." >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); fs.writeFileSync("blogboard/web/js/config.js", `window.CONFIG = { R2_PUBLIC_URL: ${JSON.stringify(process.env.R2_PUBLIC_URL)} };\n`);'

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: blogboard/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
